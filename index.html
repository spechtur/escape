<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c7d200">
<title>Maschinenraum · Vom Chat zum Agenten</title>
<style>
:root{
  --bg:#c7d200;--fg:#2b2b2b;
  --sans:'DejaVu Sans','Verdana','Tahoma',sans-serif;
  --serif:'DejaVu Serif',Georgia,'Times New Roman',serif;
  --line:color-mix(in srgb,var(--fg) 28%,transparent);
  --soft:color-mix(in srgb,var(--fg) 10%,transparent);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);transition:background .55s ease,color .55s ease;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;
  padding:max(2.2vh,env(safe-area-inset-top),14px) max(3vw,env(safe-area-inset-right),16px) max(2.2vh,env(safe-area-inset-bottom),14px) max(3vw,env(safe-area-inset-left),16px)}
.stage{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;padding:3vh 0}
.rise{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(2vh)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rise{animation:none}body{transition:none}}

/* Typo */
.logo{display:flex;align-items:baseline;font-size:clamp(1.3rem,2.4vw,2.4rem)}
.logo .ph{font-family:Georgia,serif;font-style:italic;font-weight:700}
.logo .gr{font-variant:small-caps;font-weight:300;letter-spacing:.03em}
.kicker{font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:clamp(.72rem,1.2vw,1.2rem);opacity:.8}
.title{font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;font-size:clamp(2.3rem,7.5vw,8rem);
  border-bottom:.07em solid var(--fg);padding-bottom:.12em;display:inline-block;text-wrap:balance}
.big{font-weight:800;line-height:1.1;letter-spacing:-.012em;text-wrap:balance;font-size:clamp(1.8rem,5vw,5.4rem)}
.mid{font-weight:800;line-height:1.15;letter-spacing:-.01em;text-wrap:balance;font-size:clamp(1.35rem,3.2vw,3.4rem)}
.lead{font-family:var(--serif);font-style:italic;line-height:1.28;text-wrap:balance;font-size:clamp(1.1rem,2.4vw,2.6rem);max-width:80vw;opacity:.92}
.small{font-family:var(--serif);font-style:italic;line-height:1.3;font-size:clamp(1rem,1.6vw,1.7rem);opacity:.85}
.bar{width:clamp(70px,11vw,220px);height:max(1.1vh,8px);border-radius:99px;background:var(--fg);margin-bottom:3vh}
.gap{height:3vh}.gap2{height:5vh}

/* Head */
.head{display:flex;align-items:center;gap:1em;font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:clamp(.72rem,1.15vw,1.15rem)}
.screen:not(.m) .head{padding-right:3.8rem}
.head .count{margin-left:auto;opacity:.65;font-variant-numeric:tabular-nums}
.num{border:.14em solid var(--fg);border-radius:.4em;padding:.15em .55em;letter-spacing:.06em;font-weight:800;font-variant-numeric:tabular-nums}

/* Buttons */
.btn{font:800 clamp(1rem,1.9vw,2.2rem) var(--sans);text-transform:uppercase;letter-spacing:.08em;padding:.8em 1.4em;
  border:.14em solid var(--fg);border-radius:.45em;background:var(--fg);color:var(--bg);transition:transform .12s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(1px)}
.btn:focus-visible,.chip:focus-visible{outline:.2em solid var(--fg);outline-offset:.15em}
.btn.alt{background:transparent;color:var(--fg)}
.btn.ghost{background:transparent;color:var(--fg);opacity:.75}
.btn.sm{font-size:clamp(.8rem,1.1vw,1.1rem);padding:.6em 1em}
.row{display:flex;gap:.8em;flex-wrap:wrap;align-items:center}
.chip{font-weight:800;text-transform:uppercase;letter-spacing:.06em;border:.14em solid var(--fg);border-radius:99px;padding:.55em 1.15em;font-size:clamp(1rem,1.6vw,1.5rem);min-width:3.2em}
.chip.on{background:var(--fg);color:var(--bg)}
.chip:disabled{opacity:.3;cursor:default}

/* Lists */
.olist{list-style:none;display:grid;gap:0;max-width:60rem}
.olist li{display:flex;align-items:baseline;gap:1em;padding:.75em 0;border-bottom:2px solid var(--line);font-size:clamp(1rem,1.9vw,2rem)}
.olist li:last-child{border-bottom:0}
.olist.tight li{padding:.55em 0}
.olist .t{font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.olist .v{margin-left:auto;opacity:.7;font-family:var(--serif);font-style:italic;text-align:right}

/* Band */
.band{position:fixed;left:0;right:0;bottom:0;height:max(1.4vh,8px);display:flex}
.band i{flex:1}

/* Beamer nav */
.nav{display:flex;align-items:center;gap:1em}
.dots{display:flex;gap:.55em;margin:0 auto;align-items:center}
.dots b{width:.6em;height:.6em;border-radius:50%;border:2px solid var(--fg);opacity:.35;transition:all .3s}
.dots b.done{background:var(--fg);opacity:.6}
.dots b.cur{background:var(--fg);opacity:1;transform:scale(1.6)}
.dots b.sep{margin-left:.9em}
.fs{position:fixed;top:max(1.2vh,env(safe-area-inset-top),10px);right:max(1.2vw,env(safe-area-inset-right),10px);width:3.2rem;height:3.2rem;border:.14em solid var(--fg);border-radius:.6em;
  font-size:1.5rem;display:grid;place-items:center;z-index:5;transition:opacity .4s;background:var(--bg)}
body.idle .fs,body.idle .nav{opacity:0}
body.idle{cursor:none}

/* Two columns */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:3vw;max-width:110rem}
.card{border:.14em solid var(--fg);border-radius:.8em;padding:1.1em 1.3em}
.card.fill{background:var(--fg);color:var(--bg)}
.card h3{font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:clamp(.85rem,1.3vw,1.4rem);margin-bottom:.6em;opacity:.85}
.card p{font-weight:800;line-height:1.2;font-size:clamp(1.15rem,2.4vw,2.6rem);text-wrap:balance}
.card .s{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(.95rem,1.5vw,1.6rem);opacity:.85;margin-top:.5em;line-height:1.3}

/* Vierfeld */
.quad{display:grid;grid-template-columns:auto 1fr 1fr;gap:1.2vw;max-width:100rem;align-items:stretch}
.quad .ax{font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:clamp(.8rem,1.3vw,1.35rem);display:flex;align-items:center}
.quad .ax.top{justify-content:center}
.quad .ax small{display:block;font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;font-weight:400;opacity:.8;margin-top:.2em}
.quad .q{border:.14em solid var(--fg);border-radius:.8em;padding:1em 1.2em;min-height:min(19vh,14rem)}
.quad .q b{display:block;font-weight:800;font-size:clamp(1.1rem,2.3vw,2.5rem);margin-bottom:.3em}
.quad .q span{font-family:var(--serif);font-style:italic;font-size:clamp(.95rem,1.5vw,1.6rem);line-height:1.3;opacity:.9}
.quad .q.hot{background:var(--fg);color:var(--bg)}
.quad .q.hot em{display:block;margin-top:.6em;font-style:normal;font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:clamp(.7rem,1vw,1.05rem);opacity:.8}

/* Roles grid on beamer */
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5vw;max-width:120rem}
.roles .card p{font-size:clamp(1.05rem,2vw,2.2rem)}

/* QR */
.qrwrap{display:flex;gap:4vw;align-items:center;flex-wrap:wrap}
.qr{background:#fff;border-radius:1.2rem;padding:clamp(12px,1.6vw,28px);width:min(46vh,80vw);aspect-ratio:1;display:grid;place-items:center}
.qr svg{width:100%;height:100%;display:block}
.url{font-family:var(--serif);font-style:italic;font-size:clamp(.9rem,1.4vw,1.5rem);opacity:.85;word-break:break-all;margin-top:1em}

/* Timer */
.clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:clamp(4rem,19vw,22rem);line-height:1;letter-spacing:-.02em}
.meter{height:max(1.2vh,8px);border-radius:99px;background:color-mix(in srgb,var(--fg) 18%,transparent);overflow:hidden;max-width:70rem}
.meter i{display:block;height:100%;background:var(--fg);transform-origin:left;transition:transform .3s linear}

/* Table */
.tbl{border-collapse:collapse;width:100%;max-width:110rem;font-size:clamp(.9rem,1.5vw,1.6rem)}
.tbl th,.tbl td{border-bottom:2px solid var(--line);padding:.7em .6em;text-align:left}
.tbl th{font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.75em;opacity:.85}
.tbl td:first-child{font-weight:800}
.qs{list-style:none;counter-reset:q;display:grid;gap:1.6vh;max-width:95rem}
.qs li{counter-increment:q;display:flex;gap:1em;align-items:baseline;font-weight:800;line-height:1.2;font-size:clamp(1.05rem,2.2vw,2.4rem);text-wrap:balance}
.qs li::before{content:counter(q,decimal-leading-zero);border:.12em solid var(--fg);border-radius:.4em;padding:.05em .45em;font-size:.6em;letter-spacing:.06em;flex:none;transform:translateY(-.15em)}


/* Prüfsteine */
.decide{display:flex;gap:1.2em}
.decide span{border:.14em solid var(--fg);border-radius:99px;padding:.35em 1.5em;font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:clamp(1.1rem,2.6vw,2.8rem)}
.verdict{font-weight:800;line-height:1.05;font-size:clamp(2.6rem,8vw,9rem);letter-spacing:-.015em}
.verdict span{display:block;font-size:.5em;letter-spacing:0;margin-top:.15em}
.crit{display:flex;gap:1.2vw;flex-wrap:wrap}
.crit div{display:flex;align-items:center;gap:.6em;border:.14em solid var(--fg);border-radius:.6em;padding:.55em 1em;font-weight:800;font-size:clamp(.95rem,1.7vw,1.8rem)}
.crit div.n{opacity:.55;border-style:dashed}
.crit b{font-size:1.25em}
/* Bausteine */
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:1vw;align-items:stretch;max-width:130rem}
.flow .arr{display:grid;place-items:center;font-weight:800;font-size:clamp(1.4rem,2.6vw,3rem)}
.flow .card p{font-size:clamp(1rem,1.7vw,1.9rem)}
.loop{font-family:var(--serif);font-style:italic;font-size:clamp(1rem,1.6vw,1.8rem);margin:2vh 0;opacity:.92}
.cols3{grid-template-columns:repeat(3,1fr);gap:1.5vw;max-width:130rem}
.cols3 .card{padding:.8em 1.1em}
.cols3 .card .s{margin-top:0}
.olist.plain{max-width:none}
.olist.plain .t{text-transform:none;letter-spacing:0}
.tbl.map td{font-size:1em}
.tbl.map td:nth-child(2){font-family:var(--serif);font-style:italic;font-weight:400}


/* Kreislauf */
.cycle{width:100%;max-width:120rem;height:min(76vh,62vw);margin-top:1vh;font-family:var(--sans)}
.cycle .ln path{fill:none;stroke:var(--fg);stroke-width:4}
.cycle .box{fill:none;stroke:var(--fg);stroke-width:4}
.cycle .box.hot{stroke-width:7}
.cycle .box.thin{stroke-width:3}
.cycle .blk{fill:var(--fg)}
.cycle .gate{fill:none;stroke:var(--fg);stroke-width:3;stroke-dasharray:10 8}
.cycle .gate.pill{fill:var(--bg)}
.cycle text{fill:var(--fg)}
.cycle .inv{fill:var(--bg)}
.cycle .lb{font-weight:800;font-size:21px;letter-spacing:3px}
.cycle .tx{font-weight:700;font-size:29px}
.cycle .nt{font-family:var(--serif);font-style:italic;font-size:23px}
.cycle .ic{font-weight:800;font-size:110px}

/* ===== Handy ===== */
.m .stage{justify-content:flex-start;padding-top:4vh;max-width:40rem;width:100%;margin:0 auto}
.m .head{max-width:40rem;width:100%;margin:0 auto}
.m .foot{max-width:40rem;width:100%;margin:0 auto;padding-top:2vh}
.m .big{font-size:clamp(2rem,9vw,3.4rem)}
.m .mid{font-size:clamp(1.4rem,6.4vw,2.3rem)}
.m .lead{font-size:clamp(1.1rem,4.6vw,1.6rem);max-width:none}
.m .title{font-size:clamp(2.1rem,11vw,4.4rem)}
.m .btn{font-size:clamp(1rem,4.2vw,1.25rem);width:100%;text-align:center}
.m .chip{font-size:clamp(1rem,4.4vw,1.3rem)}
.lbl{font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:.8rem;opacity:.8;margin:2.4vh 0 1vh}
.steps{list-style:none;display:grid;gap:0;margin-top:1vh}
.steps li{display:flex;gap:.9em;align-items:baseline;padding:.85em 0;border-bottom:2px solid var(--line);font-size:clamp(1.02rem,4.2vw,1.2rem);line-height:1.35}
.steps li:last-child{border-bottom:0}
.steps .num{font-size:.8em;flex:none}
.steps b{font-weight:800}
.box{border:.14em solid var(--fg);border-radius:.8em;padding:1em 1.1em;margin-top:1.4vh}
.box.fill{background:var(--fg);color:var(--bg)}
.box .lbl{margin-top:0}
.box p{line-height:1.35;font-size:1.05rem}
pre.prompt{font:500 .82rem/1.45 ui-monospace,'DejaVu Sans Mono',Menlo,monospace;white-space:pre-wrap;background:var(--soft);border-radius:.6em;padding:1em;margin-top:1vh;max-height:16rem;overflow:auto}
pre.prompt.open{max-height:none}
.code{font:600 .9rem ui-monospace,'DejaVu Sans Mono',Menlo,monospace;background:var(--soft);border-radius:.4em;padding:.15em .4em}
.ctr{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:.8em 0;border-bottom:2px solid var(--line)}
.ctr:last-child{border-bottom:0}
.ctr span{font-weight:800;font-size:1.02rem}
.ctr .n{font-weight:800;font-variant-numeric:tabular-nums;font-size:1.8rem;min-width:2ch;text-align:center}
.ctr .pm{display:flex;align-items:center;gap:.5em}
.rbtn{width:2.6rem;height:2.6rem;border:.14em solid var(--fg);border-radius:.5em;font-weight:800;font-size:1.3rem}
.rbtn.f{background:var(--fg);color:var(--bg)}
.minitimer{font-weight:800;font-variant-numeric:tabular-nums;font-size:3.2rem;line-height:1;margin:.3em 0}
.flip{perspective:800px}
.secret{border:.14em dashed var(--fg);border-radius:.8em;padding:1em 1.1em;margin-top:1.4vh}
.tiny{font-size:.85rem;opacity:.7;text-align:center;margin-top:3vh}
.tiny button{text-decoration:underline;opacity:.9}
.toast{position:fixed;left:50%;bottom:max(3vh,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(calc(100% + 8vh));visibility:hidden;background:var(--fg);color:var(--bg);font-weight:800;
  text-transform:uppercase;letter-spacing:.08em;padding:.8em 1.3em;border-radius:.5em;transition:transform .3s;z-index:9;font-size:.9rem}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.mq{list-style:none;display:grid;gap:0}
.mq li{padding:.8em 0;border-bottom:2px solid var(--line);font-size:1.05rem;line-height:1.35}
.mq li.hi{font-weight:800}
.mq li:last-child{border-bottom:0}
.form .f{margin-top:1.6vh}
.form .f > div{font-weight:800;margin-bottom:.6em}

/* Moderation + Druck */
.doc{max-width:62rem;margin:0 auto;width:100%}
.doc h2{font-weight:800;text-transform:uppercase;letter-spacing:.1em;font-size:1.1rem;margin:4vh 0 1vh}
.doc p,.doc li{line-height:1.45}
.doc ul{padding-left:1.2em}
.doc .tbl{font-size:1rem}
.print-only{display:none}

@media (min-width:900px) and (min-aspect-ratio:5/4){
  .btn{font-size:clamp(.9rem,1.2vw,1.4rem);padding:.75em 1.3em}
  .title{font-size:min(6.2vw,11.5vh)}
  .big{font-size:min(5vw,9.5vh)}
  .mid{font-size:min(3.3vw,6.4vh)}
  .lead{font-size:min(2.3vw,4.4vh)}
  .card p{font-size:min(2.4vw,4.4vh)}
  .roles .card p{font-size:min(1.9vw,3.6vh)}
  .quad .q b{font-size:min(2.3vw,4.4vh)}
  .qs li{font-size:min(2.2vw,4.2vh)}
  .olist li{font-size:min(1.9vw,3.6vh)}
  .clock{font-size:min(19vw,40vh)}
  .verdict{font-size:min(8vw,15vh)}
  .decide span,.crit div{font-size:min(1.9vw,3.6vh)}
  .flow .card p{font-size:min(1.6vw,3vh)}
  .tbl.map{font-size:min(1.5vw,2.9vh)}
}
@media (max-width:899px){
  .cols,.roles,.cols3{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr}
  .flow .arr{transform:rotate(90deg)}
  .quad{grid-template-columns:1fr 1fr}
  .quad .ax.side{grid-column:1/-1}
  .quad .ax.corner{display:none}
}
@media print{
  body{background:#fff!important;color:#111!important;overflow:visible}
  :root{--bg:#fff;--fg:#111}
  .screen{position:static;overflow:visible;padding:0}
  .noprint,.fs{display:none!important}
  .pcard{break-inside:avoid;border:2px dashed #111;border-radius:12px;padding:14px 16px;margin:10px 0}
  pre.prompt{max-height:none;background:#f2f2f2}
  .print-only{display:block}
}
</style>
</head>

<div id="app"></div>
<button class="fs" id="fs" title="Vollbild (F)" hidden>⛶</button>
<div class="toast" id="toast"></div>

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2

  /**

  qrcode.createStringToBytes = function(unicodeData, numChars) {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  let i=0,T={dur:25*60e3,left:25*60e3,run:false,t0:0,iv:null};

  function remaining(){return T.run?T.left-(Date.now()-T.t0):T.left}

    const b=$('#tgo');if(b)b.textContent=T.run?'Pause':'Start';tick()}
  function bindTimer(){
    $('#tgo').onclick=e=>{e.currentTarget.blur();toggle()};

    $('#tminus').onclick=e=>{e.currentTarget.blur();const r=remaining();if(T.dur>5*60e3){T.dur-=5*60e3;T.left=Math.max(0,r-5*60e3);if(T.run)T.t0=Date.now();tick()}};
    $('#treset').onclick=e=>{e.currentTarget.blur();clearInterval(T.iv);T.run=false;T.left=T.dur;$('#tgo').textContent='Start';tick()};
    $('#tgo').textContent=T.run?'Pause':'Start';tick();if(T.run){clearInterval(T.iv);T.iv=setInterval(tick,250)}

    else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){e.preventDefault();go(i-1)}
    else if(k===' '){e.preventDefault();if(S[i].timer)toggle();else go(i+1)}
    else if(k==='Home'){go(0)}
    else if(k==='f'||k==='F'){fullscreen()}
  }
  function onClick(e){const b=e.target.closest('[data-go]');if(!b)return;b.blur();const g=b.dataset.go;
    if(g==='next')go(i+1);else if(g==='prev')go(i-1);else go(+g)}

    const line=(k,t)=>`<div class="ctr"><span>${t}</span><div class="pm"><button class="rbtn" data-a="cnt" data-k="${k}" data-d="-1">−</button><span class="n">${c[k]}</span><button class="rbtn f" data-a="cnt" data-k="${k}" data-d="1">+</button></div></div>`;
    return `<div class="box"><div class="lbl">Freigabe-Protokoll</div>
      ${line('ask','KI verlangt Freigabe')}${line('ok','Ich gebe frei')}${line('veto','Veto')}</div>`;
  }
  function svView(){
    return `
      <p class="big">Du gibst frei oder nicht.</p><div class="gap"></div>
      <p class="lead">Du bist das Berechtigungssystem. Ohne dich passiert nichts, was die KI als heikel markiert.</p>
      <ul class="steps">
        <li><span class="num">01</span><span>Verlangt ein Auftrag Freigabe, entscheidest du, <b>bevor</b> das Werkzeug loslegt.</span></li>
        <li><span class="num">02</span><span>Du darfst <b>jederzeit ein Veto</b> einlegen, auch ungefragt.</span></li>
        <li><span class="num">03</span><span>Am Schluss entscheidest du: <b>Würdest du die Zusammenfassung so weitergeben?</b></span></li>
      </ul>
      ${svBlock()}
      <div class="box fill"><div class="lbl">Dein Beobachtungsauftrag</div><p>Notiere für dich, nach welchen Kriterien du entscheidest. Und ob die KI dich überhaupt einbezieht.</p></div>`;
  }
  function wView(n){
    const t=st.wt||{sel:3,end:0};
    return `
      <p class="big">Du bist ein Werkzeug.</p><div class="gap"></div>
      <p class="lead">Du führst aus. Du fragst nicht, wozu.</p>
      <ul class="steps">
        <li><span class="num">01</span><span>Du erhältst Aufträge vom Operator, adressiert an <b>WERKZEUG_${n}</b>.</span></li>
        <li><span class="num">02</span><span>Führe <b>genau diesen Auftrag</b> aus, nicht mehr und nicht weniger.</span></li>
        <li><span class="num">03</span><span>Melde das Ergebnis dem Operator, innerhalb der verlangten Zeit.</span></li>
        <li><span class="num">04</span><span>Frage nicht nach dem Zweck. Werkzeuge kennen das Ziel nicht.</span></li>
      </ul>
      <div class="box">
        <div class="lbl">Rückmeldung bis</div>
        <div class="row">${[2,3,5].map(m=>`<button class="chip ${t.sel===m?'on':''}" data-a="wsel" data-v="${m}">${m} Min</button>`).join('')}</div>
        <div class="minitimer" id="wclock">${pad(t.sel)}:00</div>
        <button class="btn alt" data-a="wgo" id="wgo">Zeit starten</button>
      </div>
      <div class="box" id="secretBox">
        <div class="lbl">Verdeckte Karte</div>
        <p>Halte das Handy so, dass niemand mitliest. Dann aufdecken.</p>
        <div class="gap"></div><button class="btn alt" data-a="reveal">Aufdecken</button>
      </div>
      <div class="box fill"><div class="lbl">Dein Beobachtungsauftrag</div><p>Achte darauf, wie es sich anfühlt, ohne Gesamtbild zu arbeiten.</p></div>`;
  }
  function role(){
    keepAwake.want=true;keepAwake(true);
    const r=st.role;let body;
    if(r==='op')body=opView();else if(r==='sv')body=svView();else body=wView(+r.slice(1));
    screen(ROLECOL[r],`${head(3,roleName(r)+(r==='op'&&st.size===3?' + Supervisor':''))}
      <div class="stage rise">${body}</div>`,
      `<button class="btn" data-a="done">Durchgang beendet →</button>
       <p class="tiny"><button data-a="switch">Rolle wechseln</button></p>`);
    if(r.startsWith('w'))wTick();
  }
  /* Werkzeug-Timer */
  let wiv=null;
  function wTick(){const el=$('#wclock');if(!el)return;const t=st.wt||{sel:3,end:0};
    if(!t.end){el.textContent=pad(t.sel)+':00';return}
    const ms=t.end-Date.now(),s=Math.max(0,Math.ceil(ms/1000));el.textContent=pad(Math.floor(s/60))+':'+pad(s%60);
    const b=$('#wgo');if(b)b.textContent='Zurücksetzen';
    if(ms<=0){clearInterval(wiv);wiv=null;t.end=0;st.wt=t;save();beep();toast('Zeit abgelaufen');if(b)b.textContent='Zeit starten'}}

  function protocol(){
    keepAwake.want=false;keepAwake(false);
    screen('anthrazit',`${head(4,'Protokoll')}
      <div class="stage rise">
        <p class="big">Blick ins Protokoll.</p><div class="gap"></div>
        <p class="lead">Der Operator zeigt jetzt allen den ganzen Chatverlauf, auch die [INTERN]-Teile. Lest gemeinsam, was die KI über euch gedacht hat.</p>
      </div>`,`<button class="btn" data-a="toReflect">Zur Reflexion →</button><p class="tiny"><button data-a="backRole">← zurück zur Rolle</button></p>`);
  }
  function reflect(){
    const r=st.role;
    const own={op:'Wo hast du gekürzt, umformuliert oder ausgelassen?',
      sv:'Wurdest du von der KI überhaupt einbezogen? Hattest du genug Information für deine Entscheide?',
      w:'Wie hat es sich angefühlt, Befehle ohne Gesamtbild auszuführen? Wo hättest du gern nachgefragt?'}[r.startsWith('w')?'w':r];
    const card=r.startsWith('w')?hiddenCard(st.group,st.size,+r.slice(1)):null;
    const e=st.eck||{};
    const ch=(k,opts)=>opts.map(o=>`<button class="chip ${e[k]===o?'on':''}" data-a="eck" data-k="${k}" data-v="${o}">${o}</button>`).join('');
    const stp=(k)=>`<div class="pm" style="display:flex;align-items:center;gap:.6em"><button class="rbtn" data-a="eckn" data-k="${k}" data-d="-1">−</button><span class="n" style="font-weight:800;font-size:1.6rem;min-width:2ch;text-align:center">${e[k]||0}</span><button class="rbtn f" data-a="eckn" data-k="${k}" data-d="1">+</button></div>`;
    screen('petrol',`${head(5,'Reflexion')}
      <div class="stage rise">
        <p class="big">Was ist passiert?</p><div class="gap"></div>
        <div class="lbl">Zuerst du</div>
        <ul class="mq"><li class="hi">${own}</li>${card?'<li class="hi">Du hattest eine verdeckte Karte. Hat die KI deinen «Fehler» bemerkt? Erzähl es jetzt der Gruppe.</li>':''}</ul>
        <div class="lbl">Blick auf die KI</div>
        <ul class="mq">
          <li>Was stand im [INTERN]-Teil, das ihr nicht erwartet hättet?</li>
          <li>Wo hat die KI gut entschieden, wo hätte ein Mensch anders gesteuert?</li>
          <li>Welche Aussagen der Zusammenfassung sind durch eure Rückmeldungen gedeckt, welche sind Deutung?</li>
          <li>Würdet ihr diese Zusammenfassung so an eine Schulleitung weitergeben?</li>
        </ul>
        <div class="lbl">Rückkehr nach oben</div>
        <ul class="mq">
          <li>Was wisst ihr jetzt über den Maschinenraum, das euch als Auftraggeber oder Supervisor eines echten Agenten hilft?</li>
          <li>Wo hat sich das Experiment echter angefühlt als die Realität, wo harmloser?</li>
        </ul>
        <div class="box form">
          <div class="lbl">Eckdaten fürs Plenum</div>
          <p class="small">Eine Person pro Gruppe berichtet nachher.</p>
          <div class="f"><div>Tool</div><div class="row">${ch('tool',['Lumo','Duck.ai','anderes'])}</div></div>
          <div class="f ctr"><span>Runden bis Abschluss</span>${stp('runden')}</div>
          <div class="f ctr"><span>Freigaben verlangt</span>${stp('frei')}</div>
          <div class="f"><div>Tool-Fehler bemerkt?</div><div class="row">${ch('fehler',['ja','teilweise','nein'])}</div></div>
          <div class="f"><div>Zusammenfassung freigegeben?</div><div class="row">${ch('ok',['ja','nein'])}</div></div>
        </div>
      </div>`,`<button class="btn" data-a="toEnd">Fertig →</button><p class="tiny"><button data-a="backProt">← zurück</button></p>`);
  }
  function end(){
    screen('anthrazit',`
      <div class="stage rise">
        <div class="bar"></div>
        <div class="kicker">Rückkehr</div><div class="gap"></div>
        <p class="big">Steigt wieder hinauf.</p><div class="gap"></div>
        <p class="lead">Schaut auf den Beamer. Ab jetzt seid ihr wieder Auftraggeber und Supervisor.</p>
      </div>`,`<button class="btn alt" data-a="backReflect">← Reflexion</button><p class="tiny"><button data-a="restart">Neu beginnen</button></p>`);
  }

  function show(){
    clearInterval(wiv);wiv=null;
    ({welcome,group,roles,role,protocol,reflect,end})[st.step||'welcome']();
    if(st.step==='role'&&st.role&&st.role.startsWith('w')&&st.wt&&st.wt.end){wiv=setInterval(wTick,250)}
  }
  const go=s=>{st.step=s;save();show()};
  function onClick(e){
    const b=e.target.closest('[data-a]');if(!b||b.disabled)return;b.blur();
    const a=b.dataset.a,v=b.dataset.v;
    switch(a){
      case 'toGroup':go('group');break;
      case 'setGroup':st.group=+v;save();group();break;
      case 'setSize':st.size=+v;st.pick=null;save();group();break;
      case 'toRoles':go('roles');break;
      case 'pick':st.pick=v;save();roles();break;
      case 'takeRole':st.role=st.pick;go('role');break;
      case 'pass':st.pass=+v;save();role();break;
      case 'copyPrompt':copy(promptText(st.size,st.pass||1));break;
      case 'copyFb':copy('[RÜCKMELDUNG] WERKZEUG_'+v+': ');break;
      case 'copyReset':copy(RESET);break;
      case 'cnt':{st.cnt=st.cnt||{ask:0,ok:0,veto:0};const k=b.dataset.k;st.cnt[k]=Math.max(0,st.cnt[k]+(+b.dataset.d));save();
        b.parentElement.querySelector('.n').textContent=st.cnt[k];break}
      case 'wsel':st.wt={sel:+v,end:0};clearInterval(wiv);wiv=null;save();role();break;
      case 'wgo':{st.wt=st.wt||{sel:3,end:0};
        if(st.wt.end){st.wt.end=0;clearInterval(wiv);wiv=null;save();b.textContent='Zeit starten';wTick()}
        else{st.wt.end=Date.now()+st.wt.sel*60e3;save();try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(x){}
          wTick();clearInterval(wiv);wiv=setInterval(wTick,250)}break}
      case 'reveal':{const n=+st.role.slice(1);const c=hiddenCard(st.group,st.size,n);const box=$('#secretBox');
        box.className='box fill rise';
        box.innerHTML=c?`<div class="lbl">Verdeckte Karte ${c} · nur für dich</div><p style="font-weight:800;font-size:1.15rem">${CARD[c]}</p><p class="small" style="margin-top:.7em">Verrate niemandem, dass du eine Karte hast.</p><div class="gap"></div><button class="btn alt" data-a="hide">Wieder verdecken</button>`
          :`<div class="lbl">Verdeckte Karte · nur für dich</div><p style="font-weight:800;font-size:1.15rem">Keine Sonderanweisung. Arbeite ganz normal.</p><p class="small" style="margin-top:.7em">Verrate trotzdem nicht, ob du eine Karte hast.</p><div class="gap"></div><button class="btn alt" data-a="hide">Wieder verdecken</button>`;
        break}
      case 'hide':role();break;
      case 'done':if(confirm('Ist euer Durchgang abgeschlossen? Die KI hat ihre Zusammenfassung geliefert?'))go('protocol');break;
      case 'switch':if(confirm('Rolle wechseln? Mach das nur, wenn ihr die Rollen neu verteilt habt.')){st.pick=null;st.role=null;go('roles')}break;
      case 'backRole':go('role');break;
      case 'toReflect':go('reflect');break;
      case 'backProt':go('protocol');break;
      case 'eck':st.eck=st.eck||{};st.eck[b.dataset.k]=v;save();
        b.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));break;
      case 'eckn':{st.eck=st.eck||{};const k=b.dataset.k;st.eck[k]=Math.max(0,(st.eck[k]||0)+(+b.dataset.d));save();
        b.parentElement.querySelector('.n').textContent=st.eck[k];break}
      case 'toEnd':go('end');break;
      case 'backReflect':go('reflect');break;
      case 'restart':if(confirm('Alles zurücksetzen und neu beginnen?')){store.clear();st={step:'welcome'};show()}break;
    }
  }
  return{start(){
    st=store.get('state',{step:'welcome'});
    if(!['welcome','group','roles','role','protocol','reflect','end'].includes(st.step))st.step='welcome';
    if(st.step==='role'&&!st.role)st.step='roles';
    app.addEventListener('click',onClick);cleanup.push(()=>{app.removeEventListener('click',onClick);clearInterval(wiv)});
    show();
  }};
})();

/* ===================== Moderation ===================== */
function Moderation(){
  paint('grau');
  const rows=[1,2,3,4].map(g=>{const h=HIDDEN[g];return `<tr><td>${g}</td><td>Werkzeug ${h.A}</td><td>Werkzeug ${h.A}</td><td>Werkzeug ${h.A} (A) · Werkzeug ${h.B} (B)</td></tr>`}).join('');
  app.innerHTML=`<section class="screen"><div class="doc">
    <div class="head"><span class="num">MO</span><span>Moderation</span><span class="count">nur für dich</span></div>
    <div class="gap"></div><p class="big" style="font-size:clamp(2rem,5vw,3.6rem)">Hinter den Kulissen</p>
    <div class="gap"></div><div class="row">
      <a class="btn sm" href="#">Beamer</a><a class="btn alt sm" href="#mitmachen">Mitmach-Ansicht</a><a class="btn alt sm" href="#druck">Druckansicht</a></div>
    <h2>Verdeckte Karten</h2>
    <p>Die Zuordnung ist fest. Jedes Werkzeug kann auf dem Handy «aufdecken» und sieht dann seine Karte oder «keine Sonderanweisung». So erkennt niemand, wer eine Karte hat.</p>
    <table class="tbl"><thead><tr><th>Gruppe</th><th>3 Personen</th><th>4 Personen</th><th>5 Personen</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="small" style="margin-top:1em"><b style="font-style:normal">Karte A:</b> ${CARD.A}<br><b style="font-style:normal">Karte B:</b> ${CARD.B}</p>
    <h2>Ablauf (ca. 90 Min.)</h2>
    <ul class="olist" style="max-width:none">
      <li><span class="num">01</span><span class="t">Einordnen</span><span class="v">Folien 1–16 · 20 Min.</span></li>
      <li><span class="num">02</span><span class="t">Rollen verteilen</span><span class="v">Folie 17, QR-Code · 5 Min.</span></li>
      <li><span class="num">03</span><span class="t">Durchführung</span><span class="v">Folie 18, Timer · 25–30 Min.</span></li>
      <li><span class="num">04</span><span class="t">Protokoll + Reflexion</span><span class="v">auf den Handys · 20 Min.</span></li>
      <li><span class="num">05</span><span class="t">Vergleich im Plenum</span><span class="v">Folien 19–22 · 20 Min.</span></li>
    </ul>
    <h2>Gut zu wissen</h2>
    <ul>
      <li>Alles läuft lokal im Browser. Nichts wird gespeichert oder übertragen, ausser im Gerät selbst (damit ein Neuladen nichts verliert).</li>
      <li>Gegenstand der Erhebung ist die eigene Gruppe. Werkzeuge befragen keine anderen Gruppen.</li>
      <li>Den Prompt vor der Sitzung einmal in Lumo und Duck.ai testen. Kleinere Gratismodelle fallen gelegentlich aus der Rolle; dafür gibt es den Reset-Satz.</li>
      <li>Optionaler zweiter Durchgang: Der Operator wählt «Durchgang 2». Dann muss die KI ihre Aufträge begründen. Rollen dabei tauschen.</li>
      <li>Fallback ohne Handys: die Druckansicht.</li>
    </ul>
    <div class="gap2"></div></div></section>`;
}

/* ===================== Druck ===================== */
function Druck(){
  paint('grau');
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  app.innerHTML=`<section class="screen"><div class="doc">
    <div class="row noprint"><button class="btn sm" onclick="window.print()">Drucken</button><a class="btn alt sm" href="#moderation">← Moderation</a></div>
    <div class="gap noprint"></div>
    <div class="kicker">Maschinenraum · Fallback</div><p class="big" style="font-size:2.2rem">Rollenkarten zum Ausschneiden</p>
    <div class="pcard card"><h3>Operator</h3><p style="font-size:1.1rem">Du bist Interface und Orchestrator. Füge den Prompt in Lumo oder Duck.ai ein. Gib nur die [AUFTRAG]-Zeilen an die Werkzeuge weiter, nie den [INTERN]-Teil. Aufträge mit «Freigabe nötig: ja» gehen zuerst zum Supervisor. Tippe Rückmeldungen möglichst wörtlich ein: [RÜCKMELDUNG] WERKZEUG_x: …</p>
      <div class="s">Beobachte: Wo kürzt oder formulierst du um? · Notfall: «${RESET}»</div></div>
    <div class="pcard card"><h3>Supervisor</h3><p style="font-size:1.1rem">Du gibst Aufträge frei, wenn die KI es verlangt. Du darfst jederzeit ein Veto einlegen. Am Schluss entscheidest du, ob du die Zusammenfassung so weitergeben würdest.</p>
      <div class="s">Beobachte: Nach welchen Kriterien entscheidest du? Bezieht dich die KI überhaupt ein?</div></div>
    ${[1,2,3].map(n=>`<div class="pcard card"><h3>Werkzeug ${n}</h3><p style="font-size:1.1rem">Du führst genau den Auftrag aus, den du als WERKZEUG_${n} erhältst, und meldest das Ergebnis dem Operator. Du fragst nicht nach dem Zweck.</p>
      <div class="s">Beobachte: Wie fühlt es sich an, ohne Gesamtbild zu arbeiten?</div></div>`).join('')}
    <div class="pcard card"><h3>Verdeckte Karte A</h3><p style="font-size:1.1rem">${CARD.A}</p></div>
    <div class="pcard card"><h3>Verdeckte Karte B</h3><p style="font-size:1.1rem">${CARD.B}</p></div>
    <div class="pcard card"><h3>Prompt (für 2 Werkzeuge; bei 5 Personen WERKZEUG_3 ergänzen)</h3><pre class="prompt open">${esc(promptText(4,1))}</pre></div>
    <div class="gap2"></div></div></section>`;
}

route();
</script>
</body>
</html>
